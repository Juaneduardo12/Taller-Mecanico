<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Iniciar sesión - OMEGA MECHANIC</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/menu-activo.css">
    <!-- Menú de celular: tarjeta que se desliza como cortina -->
    <link rel="stylesheet" href="css/menu-cortina.css">
    <link rel="stylesheet" href="css/seguridad.css">
    <!-- Verificación anti-robots (Cloudflare Turnstile) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>

    <header class="menu">
        <button class="boton-menu" id="botonMenu" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <span class="titulo-barra">Bienvenido a nuestro Taller Mecánico</span>

        <img src="img/Logotipo_del_taller.jpg" alt="Logo Taller" class="logo-barra" width="60" height="60">

        <nav id="menuNav">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="login.html" class="activo" aria-current="page">Login</a>
            <a>Botón 4</a>
            <a>Botón 5</a>

            <div class="menu-imagen-contenedor">
                <img src="img/img_menu.jpg" alt="Imagen del taller en menú" class="img-menu-desplegable" width="120" height="120" loading="lazy">
            </div>
        </nav>
    </header>

    <main class="login-pagina">
        <section class="login-tarjeta">

            <img src="img/Logotipo_del_taller.jpg" alt="Logo Omega Mechanic" class="login-logo" width="80" height="80">
            <h1 class="login-titulo">Iniciar sesión</h1>
            <p class="login-subtitulo">Acceso al sistema de OMEGA MECHANIC</p>

            <form id="formLogin">
                <!-- Campo de correo electrónico -->
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo"
                           placeholder="tucorreo@ejemplo.com"
                           autocomplete="email" inputmode="email" maxlength="254" required>
                </div>

                <!-- Campo de contraseña con botón Mostrar / Ocultar -->
                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <div class="campo-contrasena">
                        <input type="password" id="contrasena" name="contrasena"
                               placeholder="Tu contraseña"
                               autocomplete="current-password" maxlength="128" required>
                        <button type="button" class="boton-ver" id="togglePassword">Mostrar</button>
                    </div>
                </div>

                <!-- Verificación anti-robots -->
                <div class="captcha-contenedor" id="captchaLogin"></div>

                <p id="mensajeLogin" class="mensaje-login" role="alert" aria-live="polite"></p>

                <button type="submit" id="botonEntrar" class="boton-entrar">Entrar</button>
            </form>

            <div class="login-enlaces">
                <a href="aviso-privacidad.html" target="_blank" rel="noopener">Aviso de Privacidad</a>
            </div>

        </section>
    </main>

    <!-- Carga de scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/captcha.js"></script>
    <script src="js/script.js" defer></script>
    <script src="js/cookies.js" defer></script>
    <script src="js/login.js" defer></script>
</body>
</html>
