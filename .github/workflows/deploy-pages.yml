# Nombre del flujo de trabajo
name: Deploy to GitHub Pages

# Se activa cada vez que haces un 'push' a la rama 'main'
on:
  push:
    branches:
      - main # Asegúrate de que esta sea tu rama principal

# Permite que el flujo de trabajo lea el repositorio y escriba en la página
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se ejecuten múltiples despliegues al mismo tiempo
concurrency:
  group: "pages"
  cancel-in-progress: true

# Define los trabajos (jobs) que se ejecutarán
jobs:
  # Trabajo de despliegue (deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      # Esta acción es clave para sitios estáticos simples (HTML/CSS)
      - name: Setup Pages
        uses: actions/configure-pages@v3
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.' # Sube el directorio actual (raíz)
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2